<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Georgia, 'Times New Roman', serif">
  <title>A natural tooth beside an implant tooth: the natural root is held by the periodontal ligament, while the implant fixture, abutment and crown replace it</title>
  <defs>
    <pattern id="trab" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="8" r="3" fill="#d9c4a2" />
      <circle cx="19" cy="19" r="2.2" fill="#d9c4a2" />
    </pattern>
    <clipPath id="fixture">
      <path d="M764 396 L876 396 L870 610 C866 650 848 676 820 680 C792 676 774 650 770 610 Z" />
    </clipPath>
  </defs>
  <rect width="1200" height="720" fill="#fbf7f1" />

  <!-- bone, then gum, across both teeth -->
  <rect x="160" y="400" width="960" height="320" fill="#ead9bc" />
  <rect x="160" y="400" width="960" height="320" fill="url(#trab)" />
  <path d="M160 352 C260 334 330 320 352 316 L428 316 C450 320 520 334 600 342 C680 334 750 320 772 316 L868 316 C890 320 960 334 1120 352 L1120 426 L160 426 Z" fill="#e7a3a0" />

  <!-- natural tooth: ligament band, root with cementum, crown -->
  <path d="M352 318 C354 450 372 560 386 650 Q390 664 394 650 C408 560 426 450 428 318" fill="none" stroke="#e3a090" stroke-width="38" />
  <path d="M318 200 C316 160 330 135 352 132 C368 130 378 142 390 146 C402 142 412 130 428 132 C450 135 464 160 462 200 C460 250 448 290 430 318 C428 450 408 560 394 650 Q390 664 386 650 C372 560 352 450 350 318 C332 290 320 250 318 200 Z" fill="#fffdf8" stroke="#141210" stroke-width="2.5" />
  <path d="M430 318 C428 450 408 560 394 650 Q390 664 386 650 C372 560 352 450 350 318" fill="none" stroke="#b98a4c" stroke-width="7" />

  <!-- implant: fixture with threads, abutment, then a see-through crown over the abutment -->
  <rect x="760" y="396" width="120" height="290" fill="#b9bec4" clip-path="url(#fixture)" />
  <g clip-path="url(#fixture)" stroke="#7d848c" stroke-width="7">
    <path d="M750 424 L890 406" /><path d="M750 454 L890 436" /><path d="M750 484 L890 466" /><path d="M750 514 L890 496" />
    <path d="M750 544 L890 526" /><path d="M750 574 L890 556" /><path d="M750 604 L890 586" /><path d="M750 634 L890 616" />
    <path d="M750 664 L890 646" />
  </g>
  <path d="M764 396 L876 396 L870 610 C866 650 848 676 820 680 C792 676 774 650 770 610 Z" fill="none" stroke="#141210" stroke-width="2.5" />
  <path d="M786 396 L796 236 L844 236 L854 396 Z" fill="#d6dade" stroke="#141210" stroke-width="2.5" />
  <path d="M748 200 C746 160 760 135 782 132 C798 130 808 142 820 146 C832 142 842 130 858 132 C880 135 894 160 892 200 C890 250 878 290 860 318 L780 318 C762 290 750 250 748 200 Z" fill="#fffdf8" fill-opacity="0.78" stroke="#141210" stroke-width="2.5" />

  <!-- titles -->
  <text x="390" y="56" font-size="28" font-weight="bold" text-anchor="middle" fill="#141210">Natural tooth</text>
  <text x="820" y="56" font-size="28" font-weight="bold" text-anchor="middle" fill="#141210">Implant tooth</text>

  <!-- natural tooth labels, on the left -->
  <g stroke="#141210" stroke-width="1.5" opacity="0.55">
    <path d="M322 200 L220 200" /><path d="M360 480 L220 480" /><path d="M352 570 L220 570" />
  </g>
  <g font-size="22" fill="#141210" text-anchor="end">
    <text x="210" y="207">Crown</text>
    <text x="210" y="487">Root</text>
  </g>
  <text x="210" y="570" font-size="22" font-weight="bold" fill="#a87a3e" text-anchor="end">Periodontal</text>
  <text x="210" y="596" font-size="22" font-weight="bold" fill="#a87a3e" text-anchor="end">ligament</text>

  <!-- implant labels, on the right -->
  <g stroke="#141210" stroke-width="1.5" opacity="0.55">
    <path d="M888 200 L960 200" /><path d="M850 280 L960 280" /><path d="M874 520 L960 520" />
  </g>
  <text x="970" y="207" font-size="22" fill="#141210">Crown</text>
  <text x="970" y="287" font-size="22" font-weight="bold" fill="#a87a3e">Abutment</text>
  <text x="970" y="313" font-size="17" fill="#6b645b">the connector</text>
  <text x="970" y="527" font-size="22" font-weight="bold" fill="#a87a3e">Implant fixture</text>
  <text x="970" y="553" font-size="17" fill="#6b645b">fuses with the bone,</text>
  <text x="970" y="575" font-size="17" fill="#6b645b">no ligament</text>
</svg>
